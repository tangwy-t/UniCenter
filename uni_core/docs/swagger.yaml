info:
  contact:
    email: support@example.com
    name: API Support
  description: 企业级 RBAC 权限管理系统后端 API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: RBAC Admin API
  version: 1.0.0
paths:
  /captcha/generate:
    post:
      consumes:
      - application/json
      description: 生成数学题图片验证码，返回 captchaKey 和 base64 图片
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/captcha.Result'
              type: object
        "429":
          description: 请求频率过高
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.Response'
      summary: 获取验证码
      tags:
      - 认证
  /configs:
    get:
      consumes:
      - application/json
      description: 分页查询参数配置列表，支持按配置键筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: pageSize
        type: integer
      - description: 配置键(模糊查询)
        in: query
        name: configKey
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/app.PageResponse'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 参数配置列表
      tags:
      - 参数配置
    post:
      consumes:
      - application/json
      description: 创建新的参数配置
      parameters:
      - description: 创建参数配置请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/request.CreateConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 创建参数配置
      tags:
      - 参数配置
  /configs/{id}:
    delete:
      consumes:
      - application/json
      description: 软删除指定参数配置
      parameters:
      - description: 配置ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: 参数配置不存在
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 删除参数配置
      tags:
      - 参数配置
    get:
      consumes:
      - application/json
      description: 根据配置 ID 查询参数配置详细信息
      parameters:
      - description: 配置ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.ConfigResp'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: 参数配置不存在
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 参数配置详情
      tags:
      - 参数配置
    put:
      consumes:
      - application/json
      description: 更新指定参数配置的信息
      parameters:
      - description: 配置ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: 更新参数配置请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/request.UpdateConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: 参数配置不存在
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 更新参数配置
      tags:
      - 参数配置
  /configs/key/{key}:
    get:
      consumes:
      - application/json
      description: 根据配置键直接获取配置值
      parameters:
      - description: 配置键
        in: path
