  /devices/overview:
    get:
      consumes:
      - application/json
      description: |-
        一次请求返回 N 台设备的最新快照（水位全字段）与多列趋势（列式，共享时间轴），按指标类别分组绘图即可得到「所有设备 × 各类指标」的总览视图
        range 选档与 /devices/{id}/metrics **完全同口径**（≤24h Redis / ≤30d 5min / >30d 1h）；metrics 为逗号白名单，* 表示该档全部可用列
        ids 可显式指定设备白名单（「只对比勾选的这几台」）；hostname/status/online 为页面级过滤
        设备数超过上限时**截断并置 truncated**（不报错），单台设备的趋势取数失败降级为该设备的 error 字段（不影响其余设备）
      parameters:
      - default: 86400
        description: 时间窗口(秒)
        in: query
        name: range
        type: integer
      - description: 逗号分隔的指标列白名单，* 表示该档全部可用列
        in: query
        name: metrics
        type: string
      - description: 设备ID白名单(逗号分隔)，用于只看选定设备
        in: query
        name: ids
        type: string
      - description: 主机名模糊匹配
        in: query
        name: hostname
        type: string
      - description: 启停状态(0停用/1启用)
        in: query
        name: status
        type: integer
      - description: 是否在线(在线判定依 sys.agent.offlineThreshold)
