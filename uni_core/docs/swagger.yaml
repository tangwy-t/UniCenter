            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DeviceOverviewResp'
              type: object
        "400":
          description: 参数错误(range 越界 / 列不在该档可用列集 / ids 含非法设备ID)
          schema:
            $ref: '#/definitions/app.Response'
        "401":
