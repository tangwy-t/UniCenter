  response.AgentReleaseItem:
    properties:
      arch:
        type: string
      createdAt:
        type: integer
      deletable:
        description: |-
          Deletable 是**服务端算好的结论**：该版本是否还没被任何升级尝试用过。
          前端据此禁用删除按钮并说明原因，而不是点了才报错 —— 回滚余量是硬约束
          （用过即禁删），把它做成一个「按下才知道」的失败体验没有必要。
        type: boolean
      fileName:
        type: string
      id:
        example: "0"
        type: string
      notes:
        type: string
      os:
        type: string
      publishedAt:
        description: PublishedAt 只在已发布时有值（撤回时置空）。
        type: integer
      sha256:
        description: |-
          SHA256 是服务端落盘时算的摘要。前端**只展示不解释**（不出现「sha256」等
          内部术语的地方也不该出现它的值 —— 展示层只给大小与时间）。
        type: string
      sizeBytes:
        type: integer
      status:
        type: integer
      version:
        type: string
    type: object
  response.AgentReleaseListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/response.AgentReleaseItem'
        type: array
      publishedVersions:
        description: |-
