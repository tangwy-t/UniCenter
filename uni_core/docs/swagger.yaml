      produces:
      - application/json
      responses:
        "202":
          description: 已受理（data.ref 为指令号）
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DockerCmdResp'
              type: object
        "400":
          description: 参数错误 / 未知操作
          schema:
            $ref: '#/definitions/app.Response'
        "401":
