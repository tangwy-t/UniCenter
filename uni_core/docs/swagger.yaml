  response.DockerOverviewAnomalyItem:
    properties:
      hostId:
        example: "0"
        type: string
      hostname:
        type: string
      id:
        description: |-
          ID 是容器的完整 ID（同 DockerContainerItem.ID）：异常行点进去要能深链到
          容器详情页（/docker/container-detail/:id），没有它前端只能干列名字。
        type: string
      image:
        type: string
      name:
        type: string
      protected:
        description: |-
          Protected 是 agent 按保护清单算好的结论：控制塔**不**据此拦截操作（拦在
