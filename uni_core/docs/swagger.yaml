          Total 是**截断前**的非 running 容器全量数；Items 至多 50 条。
          两者并存：控制塔要一眼知道「舰队里有几个不正常的容器」，详情只给前 50 ——
          超限时 Total 与 Items 长度不等，即「截断了」的显式口径（不靠前端猜）。
