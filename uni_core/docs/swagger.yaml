  /docker/tasks:
    get:
      description: 任务中心的一页：实时（CmdStore，含在途）+ 历史（持久层）按 ref 合并去重（实时胜）、受理时刻降序；hostId
        限定单主机、status 过滤 pending/done、action 过滤动作码；page/pageSize 分页（缺省 1/10，页大小上限 100），total
        为合并列表全量；条目含 ref/主机/动作/目标/发起人用户名/受理时刻/终态（pending/succeeded/failed/timeout）/终态结论句；进度族任务（image:pull/build/push）前端凭
        action 复用 /cmds/:ref/pull|build|push 打开进度流（观看）；取消走 POST /cmds/:ref/cancel
      parameters:
      - description: 限定单主机(缺省=跨主机)
        format: int64
        in: query
        name: hostId
        type: integer
      - description: 阶段过滤(pending/done)
        in: query
        name: status
        type: string
      - description: 动作码过滤(如 image:pull)
        in: query
        name: action
        type: string
      - description: 页码(缺省 1)
        in: query
        name: page
        type: integer
      - description: 每页条数(缺省 10,上限 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DockerTaskListResp'
              type: object
        "400":
          description: 参数错误(status 非 pending/done) / 未知操作
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限(docker:list)
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 任务列表
      tags:
      - Docker 管理
