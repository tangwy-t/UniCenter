  /monitor/cache/keys/value:
    get:
      consumes:
      - application/json
      description: |-
        按 value 类型分页查询 key 的值与 TTL：list/zset 用 offset+limit 分页，
        set/hash 用 cursor+limit 游标分页，string 用 limit 作字节窗；TTL=-2 表示 key 不存在
      parameters:
      - description: 目标缓存 key
        in: query
        name: key
        required: true
        type: string
      - description: list/zset 起始下标、string 起始字节
        format: int64
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: list/zset/set/hash 每页条数(≤200)、string 字节窗(≤4MB)
        format: int64
        in: query
        maximum: 4194304
        minimum: 1
        name: limit
        type: integer
      - description: set/hash 的 SCAN 游标，0 表示从头扫，续扫传上页 next_cursor
        format: int64
        in: query
        minimum: 0
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.CacheValuePage'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: key 不存在
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 缓存key值
      tags:
      - 缓存管理
