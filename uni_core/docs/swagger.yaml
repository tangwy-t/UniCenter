      description: |-
        整机趋势：range 选档（≤24h Redis 原始 / ≤30d 5min 表 / >30d 1h 表），metrics 为逗号白名单（* 表示该档全部可用列）
        资源下钻：kind+name 成对出现（kind ∈ disk/disk_io/nic/sensor，name 为挂载点/设备名/网卡名/传感器名）
      parameters:
      - description: 设备ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - default: 86400
        description: 时间窗口(秒)
        in: query
        name: range
        type: integer
      - description: 逗号分隔的指标列白名单，* 表示该档全部可用列
        in: query
        name: metrics
        type: string
      - description: 资源种类(disk/disk_io/nic/sensor)，与 name 成对
        in: query
        name: kind
        type: string
      - description: 资源名(挂载点/设备名/网卡名/传感器名)，与 kind 成对
        in: query
        name: name
        type: string
      produces:
