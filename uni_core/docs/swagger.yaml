    get:
      description: 全部可管主机的容器并成一张表（每行带 hostId/hostname 归属）；hostId 限定单主机、state 过滤运行态（stopped=一切非
        running，与总览 KPI 同口径）、keyword 按容器名或镜像名子串匹配；上限 500 条、total 如实报截断前全量；单台快照读失败跳过该主机（其故障在总览页如实呈现）
      parameters:
      - description: 限定单主机(缺省=全部可管主机)
        format: int64
        in: query
        name: hostId
        type: integer
      - description: 运行态过滤(running/stopped)
        in: query
        name: state
        type: string
      - description: 容器名或镜像名子串(大小写不敏感)
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DockerWorkloadListResp'
              type: object
        "400":
          description: 参数错误(state 非 running/stopped)
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/app.Response'
