  request.DeviceBatchUpgradeRequest:
    properties:
      expectedCount:
        description: ExpectedCount 只在 filter 路径生效（ids 路径的影响面由 ids 自身确定）。
        type: integer
      filter:
        $ref: '#/definitions/request.DeviceQuery'
      ids:
        items:
          type: integer
        type: array
      version:
        type: string
    required:
    - version
    type: object
  request.DeviceQuery:
    properties:
      hostname:
        description: Hostname 模糊匹配（LIKE %v%）。
        type: string
      online:
        description: |-
          Online 在线过滤；nil = 不过滤。在线判定由 service 依
          sys.agent.offlineThreshold 折算成 onlineSince 后交给仓储。
        type: boolean
      page:
        maximum: 10000
        minimum: 1
        type: integer
      pageSize:
        maximum: 100
        minimum: 1
        type: integer
      status:
        description: Status 精确匹配启停态；nil = 不过滤。
        type: integer
    type: object
  request.DeviceUpgradeGlobalRequest:
    properties:
      version:
        type: string
    type: object
  request.DeviceUpgradeTargetRequest:
    properties:
      pin:
        description: |-
          Pin 为 true 时表示「固定在当前版本」：即使版本与当前相同也**写下设备级目标**，
          使它不再跟随全站目标。

          为什么必须显式传而不是从「版本 == 当前」推出来：一次普通的升级下发里，
          「已经在该版本上」的设备应当**保持跟随全站**（不写设备级目标）—— 否则
          一次全站升级会把每台设备都打上设备级目标，「跟随全站」的比例悄悄变成 0，
          下一次改全站目标时谁都跟不上。固定是一个**独立意图**，必须由调用方明说。
        type: boolean
      version:
        description: |-
          Version 必须是合法 semver；**允许低于当前版本**（那就是回滚）——
          服务端只校验形态，不校验方向：回滚不是错误操作。
        type: string
    required:
    - version
    type: object
  request.DockerCmdReq:
    type: object
  request.DockerRegistrySaveReq:
    properties:
      password:
        description: Password 是仓库密码（明文仅在本次请求内瞬时存在；**每次创建/更新都重输**）。
        type: string
      registry:
        description: |-
          Registry 是仓库地址（唯一键：主机名/IP + 可选端口，不含协议头与镜像路径；
          形态校验在 service 复用协议 IsDockerRegistryAddr）。
        type: string
      remark:
        description: Remark 是备注（可选）。
        type: string
      username:
        description: Username 是仓库登录名。
        type: string
    required:
    - password
    - registry
    - username
    type: object
