        type: number
      mem_used_mb:
        type: number
      mem_used_percent:
        type: number
      nic_rx_bytes_sec:
        type: number
      nic_tx_bytes_sec:
        type: number
      proc_count:
        type: integer
      samples:
        type: integer
      swap_used_mb:
        type: number
      swap_used_percent:
        type: number
      t:
        description: 桶起始 unix 秒
        type: integer
      tcp_established:
        type: integer
      tcp_listen:
        type: integer
      tcp_total:
        type: integer
      uptime_sec:
        type: integer
    type: object
  response.DeviceMetricsResp:
    properties:
      available_metrics:
        description: |-
          AvailableMetrics 是本响应的**可用列集**：用于区分「该列未采集（值为空）」
          与「该档位不产该列（列不存在）」。半年视图上的 agent_* / tcp_time_wait
          属于后者，前端应据此显示「该档位无此指标」而不是「—」。

          取值 = **该表的值列 ∩ agentmetrics.TrendPoint 实际承接的列**（再按档位
          减去 5min-only 列）。为什么不直接给「该表全部列」：表里有约 20 列
          （tcp_time_wait / udp_total / *_ops_sec / agent_* …）没有任何响应字段去装，
          把它们声明成「可用」会让消费方继续误读成「agent 挂了」—— 那正是
          available_metrics 要消除的误读。
        items:
          type: string
        type: array
      buckets:
        description: Buckets 稀疏：空桶**不产行**（§7.1），t 有洞；只能用 t 定位，禁止按下标推算。
        items:
          $ref: '#/definitions/response.DeviceMetricPoint'
        type: array
      range_seconds:
        description: RangeSeconds 是实际窗口（秒）。前端按它决定轴刻度与 tooltip 粒度。
        type: integer
      resolution_seconds:
        description: |-
          ResolutionSeconds 是**实际生效**的桶宽（可能因 4000 上限被升档，如 30/900/7200）。
          前端只信本字段，不得按「1h/24h/7d…」按钮名猜粒度。
        type: integer
      source:
        description: Source 是数据源（redis / db），仅供调试与观测，业务不依赖。
        type: string
    type: object
  response.DeviceOverviewItem:
    properties:
      error:
        description: |-
          Error 是**该设备单独**的趋势取数失败原因（已脱敏，面向用户可读）。
          有值时该设备的快照（Watermark）仍然有效——故障被局部化。
        type: string
      hostname:
        type: string
      id:
        description: |-
          ID 用 `json:"id"`（**不带** `,string`）：本字段已经是 string，而 Go 的
          `,string` 选项对 string 类型字段会**再加一层引号**（把 `2100772…`
          编码成 `"\"2100772…\""`）。既有 DeviceListItem 之所以能写 `,string`，
          是因为它那边是 uint64（需要转成 JSON 字符串以避免 JS 大整数精度丢失）；
          这里已在服务层 strconv.FormatUint 转过一次，再带 `,string` 就是双重编码。

          实测症状：页面上设备 ID 显示成 `"2100772873982447616"`（带字面引号），
          且勾选设备时下发的 ids 也带引号 → 后端 400。
        type: string
      lastSeenAt:
        description: LastSeenAt 是最后上报时刻（unix 秒）；从未上报则不出现。
        type: integer
      online:
        type: boolean
      os:
        type: string
      platform:
        description: Platform / OS 用于行内图标（deviceIcon）与次级标识。
        type: string
      series:
        description: |-
          Series 是 `AvailableMetrics` 的按列趋势，顺序与请求的列序一致。
          取数失败时为空，并置 `Error`。
        items:
          $ref: '#/definitions/response.DeviceOverviewSeries'
        type: array
      stale:
        type: boolean
      status:
        type: integer
      watermark:
        additionalProperties:
          format: float64
          type: number
        description: |-
          Watermark 是**水位全字段**快照（键名即整机宽表列名，如
          `cpu_used_percent`）——直接复用列名是为了让快照图表与趋势图表
          用同一套 METRIC_META 元数据（中文名/单位/分组），不需要第二张映射表。

          缺值列**不出现在 map 里**（而不是出现且为 null）：水位本身是
          `omitempty` 投影，没采集到的列压根不落 Redis。
        type: object
      watermarkAt:
        description: WatermarkAt 是水位（最新样本）的采样时刻（unix 秒）。
        type: integer
    type: object
  response.DeviceOverviewResp:
    properties:
      available_metrics:
        description: |-
          AvailableMetrics 是本次实际可用的**整机宽表列名**（snake_case），
          剔除 bucket_ts。消费方据此决定「哪些图表有数据」，而**不得**硬编码列名
          （与设备详情页同口径：有没有这一列由后端决定）。
        items:
          type: string
        type: array
      axis:
        description: |-
          Axis 是所有设备共享的时间轴（桶起始 unix 秒，升序）。
          每条 series 的 Values 与 Axis 等长且一一对应。
        items:
          type: integer
        type: array
      axis_step_seconds:
        description: AxisStepSeconds 是抽样步长（秒）：1 表示未抽样，>1 表示每隔 N 个原始桶取 1 个。
        type: integer
      device_total:
        description: DeviceTotal 是过滤后命中的设备总数（未截断前）。
        type: integer
      devices:
        items:
          $ref: '#/definitions/response.DeviceOverviewItem'
        type: array
      downsampled:
        description: |-
          Downsampled 为真时必须让用户看见（UI 应标注「已抽样」）——
          抽样会**丢失尖峰**，静默抽样会让用户以为看到的是全部细节。
        type: boolean
      max_devices:
        description: MaxDevices 是本次生效的设备数上限（随响应下发，供 UI 说明）。
        type: integer
      range_seconds:
        description: RangeSeconds 是本次趋势窗口（秒）。
        type: integer
      resolution_seconds:
        description: ResolutionSeconds 是**原始**桶宽（秒，来自选档），非抽样后的步长。
        type: integer
      source:
        description: Source 是数据来源档位：redis（≤24h，热层）| db（>24h，冷层）。
        type: string
      summary:
        $ref: '#/definitions/response.DeviceOverviewSummary'
      truncated:
        description: Truncated 为真表示设备数超过 MaxDevices，只返回了前 MaxDevices 台。
        type: boolean
    type: object
  response.DeviceOverviewSeries:
    properties:
      avg:
        type: number
      last:
        description: |-
          以下统计量均由**非空值**算出；无任何非空值时全部不出现（omitempty），
          消费方据此显示「无数据」而不是 0。

          为什么在后端算：这些是「一列数字的聚合」，设备数 × 列数在上限内
          （见 MaxDevices），后端算一次比让 N 个客户端各算一次更省，且口径唯一。
        type: number
      max:
        type: number
      metric:
        description: Metric 是整机宽表列名（snake_case），与 `AvailableMetrics` 同集合。
        type: string
      min:
        type: number
      missing:
        type: integer
      present:
        description: |-
          Present / Missing 是桶计数：两者之和 = len(Axis)。
          它们让「覆盖率」可被直接展示（例如「344 桶中 12 桶无数据」），
          而不需要前端再遍历一遍。
        type: integer
      values:
        description: Values 与 `DeviceOverviewResp.Axis` 等长；`null` = 该桶无数据（≠ 0）。
        items:
          type: number
        type: array
    type: object
  response.DeviceOverviewSummary:
    properties:
      disabled:
        description: Disabled 是管理侧停用态（与在线状态正交）：停用的设备仍可能在线。
        type: integer
      offline:
        type: integer
      offline_threshold_sec:
        description: |-
          OfflineThresholdSec 是本次判定实际使用的离线阈值（秒），随响应下发，
          保证 UI 文案与 `Online` 的判定永远同口径（同 DeviceResp 的理由）。
        type: integer
      online:
        description: |-
          Online / Offline 由 last_seen_at 与 sys.agent.offlineThreshold 判定，
          与列表页 `online` 字段**同源同口径**（同一次配置读取）。
        type: integer
      stale:
        description: |-
          Stale 是有水位、但水位采样时刻已超过离线阈值（数据陈旧）的设备数。
          它与 Offline 不等价：Offline 看的是「最后上报时间」，Stale 看的是
          「最新水位那条样本的时间」——设备可能在上报心跳却停止上报指标。
        type: integer
      total:
        type: integer
    type: object
  response.DeviceResourceItem:
    properties:
      kind:
        type: string
      lastSeenAt:
        description: LastSeenAt 是最近一次被观测到的时间（unix 秒）；Stale 为 true 时前端应标注「已消失」。
        type: integer
      name:
        type: string
      stale:
        type: boolean
    type: object
  response.DeviceResourcePoint:
    properties:
      samples:
        description: |-
          Samples 是命中该资源的样本数（热层档 = 该桶内出现该资源的样本条数；
          子表**没有** samples 列，DB 档恒为 0 —— 完整度信号只在整机宽表上）。
        type: integer
      t:
        type: integer
      values:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  response.DeviceResourceResp:
    properties:
      available_metrics:
        description: |-
          AvailableMetrics 是**这次响应真实的列集**（= 子表的列，或按 metrics 过滤后的子集）。
          它不含 bucket_ts：桶时间走 `t`，不是 values 里的一个键。
        items:
          type: string
        type: array
      buckets:
        items:
          $ref: '#/definitions/response.DeviceResourcePoint'
        type: array
      name:
        description: 挂载点 / 设备名 / 网卡名 / 传感器名
        type: string
      range_seconds:
        type: integer
      resolution_seconds:
        type: integer
      resource_kind:
        description: disk|disk_io|nic|sensor
        type: string
      source:
        type: string
    type: object
  response.DeviceResourcesResp:
    properties:
      list:
        items:
          $ref: '#/definitions/response.DeviceResourceItem'
        type: array
    type: object
  response.DeviceResp:
    properties:
      agentUpgradeSupported:
        description: |-
          AgentUpgradeSupported 是设备自报的「我这一版能被远程升级」。
          false 时页面禁用升级按钮并给结论式提示（现场存量 0.1.0 属于这一档）。
        type: boolean
      agentVersion:
        type: string
      arch:
        type: string
      bootTime:
        type: integer
      cpuCores:
        type: integer
      cpuModel:
        type: string
      cpuUsedPercent:
        description: 以下来自 Redis latest（缺值省略 → 前端显示「—」）
        type: number
      createdAt:
        description: unix 秒
        type: integer
      diskUsedPercent:
        type: number
      hostname:
        type: string
      id:
        example: "0"
        type: string
      kernel:
        type: string
      lastSeenAt:
        description: unix 秒
        type: integer
      memTotalMb:
        type: number
      memUsedPercent:
        type: number
      offlineThresholdSec:
        description: |-
          OfflineThresholdSec 是**后端实际生效**的离线判定阈值（秒），来自
          sys.agent.offlineThreshold（可热更）。

          为什么必须由后端给出、而不是前端写死 30：阈值可热更，前端硬编码会在
          后端热更后与之**静默矛盾** —— UI 说「30 秒内未上报即离线」，而判定
          其实已按 60 秒算。这比不显示阈值更糟：它看起来是个可信的数字。
          与 onlineSince 同源下发，保证「响应里的 online」与「UI 文案」永远同口径。
        type: integer
      online:
        description: Online 由 last_seen_at 与 sys.agent.offlineThreshold 推导（不落库）。
        type: boolean
      os:
        type: string
      platform:
        type: string
      platformVer:
        type: string
      primaryIp:
        description: |-
          PrimaryIP 是**服务端观测到**的 agent 来源 IP（详见 entity.Device.PrimaryIP）。

          放在 DeviceResp 而**不**放 DeviceListItem：列表页已有主机名/OS/架构/在线/
          启停/水位等列，再加 IP 会挤压操作列；而 IP 的价值场景（定位设备、SSH）
          都在详情页发生。列表若需要，后续按需再提列即可。

          omitempty：未观测到时整个字段不出现（老设备在升级本版本前 enroll 的行、
          或测试态未接管 socket）—— 与水位三字段同一约定，前端显示「—」，
          **不臆造空串**。
        type: string
      rollbackVersion:
        description: |-
          RollbackVersion 是「一键回滚」的目标版本：该设备最近一次成功升级的**起始版本**，
          由升级域从升级记录推导。空串 = 没有成功历史（页面禁用回滚按钮）。
        type: string
      status:
        type: integer
      targetFromGlobal:
        description: TargetFromGlobal 表示该目标来自全站（页面标注「跟随全站」/「设备指定」）。
        type: boolean
      targetVersion:
        description: TargetVersion 是**生效目标**（设备级指定优先，否则全站目标）。
        type: string
      upgradeAt:
        description: UpgradeAt 是最近一次终态的时刻（unix 秒）。
        type: integer
      upgradePhase:
        description: UpgradePhase 是**推导**出来的相位：achieved | running | pending（空 = 无目标）。
        type: string
      upgradeReason:
        description: UpgradeReason 是终态的原因码（展示层翻译成结论）。
        type: string
      upgradeResult:
        description: UpgradeResult 是最近一次终态（0 无 / 1 已达成 / 2 失败 / 3 已回滚）。
        type: integer
      watermarkAt:
        description: WatermarkAt 是水位采样时刻（unix 秒）。
        type: integer
    type: object
  response.DeviceUpgradeBucket:
    properties:
      achieved:
        description: Achieved 是已达成的台数（**读时推导**：生效目标 == 当前版本）。
        type: integer
      disabled:
        type: integer
      failed:
        type: integer
      noArtifact:
        type: integer
      pending:
        type: integer
      rolledBack:
        type: integer
      running:
        description: Running 是升级中的台数（存在未终结尝试）。
        type: integer
      targetVersion:
        description: TargetVersion 为空 = 无目标（既没有设备级也没有全站目标）。
        type: string
      total:
        type: integer
      unsupported:
        description: |-
          Unsupported / NoArtifact / Disabled 是三类「想升也升不了」的台数
          （见 DeviceUpgradeSkip）。Disabled 在汇总里要单列：停用设备根本连不上，
          把它混进「等待上线」会让运维去等一台永远不会上线的机器。
        type: integer
    type: object
  response.DeviceUpgradeDispatchResp:
    properties:
      dispatched:
        type: integer
      skip:
        $ref: '#/definitions/response.DeviceUpgradeSkip'
      targetVersion:
        type: string
      taskId:
        description: TaskID 是本次下发建出的任务（前端用它跳到任务页看进度）。
        type: string
    type: object
  response.DeviceUpgradeGlobalResp:
    properties:
      affected:
        description: Affected 是生效目标随之改变、需要动一动的台数。
        type: integer
      pinnedDevices:
        description: |-
          PinnedDevices 是设备级已指定版本、**不跟随全站**的台数。
          它是全站变更时最容易被忽略的一类：页面必须把它说出来，否则
          「全站都升了」会与「这几台没动」同时成立而没人知道为什么。
        type: integer
      targetVersion:
        description: TargetVersion 是**变更后**的全站目标（空 = 已关闭全站升级）。
        type: string
      taskId:
        description: TaskID 是本次变更建出的任务（为空 = 没有设备需要动）。
        type: string
    type: object
  response.DeviceUpgradePreviewResp:
    properties:
      matched:
        description: Matched 是筛选命中的台数（不管能否升级）。
        type: integer
      skip:
        $ref: '#/definitions/response.DeviceUpgradeSkip'
      targetVersion:
        type: string
      willUpgrade:
        description: WillUpgrade 是实际会下发的台数 = Matched - Skip.Total()。
        type: integer
    type: object
  response.DeviceUpgradeRecord:
    properties:
      createdAt:
        type: integer
      finishedAt:
        type: integer
      fromVersion:
        type: string
      id:
        example: "0"
        type: string
      reasonCode:
        type: string
      state:
        type: string
      toVersion:
        type: string
    type: object
  response.DeviceUpgradeSkip:
    properties:
      alreadyOnTarget:
        type: integer
      disabled:
        type: integer
      noArtifact:
        type: integer
      unsupported:
        type: integer
    type: object
  response.DeviceUpgradeSummaryResp:
    properties:
      buckets:
        items:
          $ref: '#/definitions/response.DeviceUpgradeBucket'
        type: array
      globalTargetVersion:
        description: GlobalTargetVersion 是当前全站目标（空 = 未开启全站升级）。
        type: string
      pinnedDevices:
        description: PinnedDevices 是设备级指定了版本的台数（不跟随全站）。
        type: integer
      total:
        type: integer
      versionDistribution:
        description: VersionDistribution 是当前版本分布（新→旧按台数降序）。
        items:
          $ref: '#/definitions/response.DeviceVersionCount'
        type: array
    type: object
  response.DeviceVersionCount:
    properties:
      count:
        type: integer
      version:
        type: string
    type: object
  response.DictDataResp:
    properties:
      createdAt:
        type: string
      id:
        example: "0"
        type: string
      isDefault:
        type: integer
      label:
        type: string
      listClass:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      typeId:
        example: "0"
        type: string
      updatedAt:
        type: string
      value:
        type: string
    type: object
  response.DictItem:
    properties:
      is_default:
        type: boolean
      label:
        type: string
      list_class:
        type: string
      sort:
        type: integer
      value:
        type: string
    type: object
  response.DictTypeResp:
    properties:
      code:
        type: string
      createdAt:
        type: string
      id:
        example: "0"
        type: string
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
      updatedAt:
        type: string
    type: object
  response.DiskInfo:
    properties:
      error:
        type: string
      freeGB:
        type: number
      path:
        type: string
      totalGB:
        type: number
      usagePercent:
        type: number
      usedGB:
        type: number
    type: object
  response.DockerBuildContextUploadResp:
    properties:
      filename:
        type: string
    type: object
  response.DockerCmdResp:
    properties:
      ref:
        description: Ref 是指令号：前端用它轮询结果。
        type: string
    type: object
  response.DockerCmdResultResp:
    properties:
      alreadyExists:
        type: boolean
      detail:
        description: Detail 是排障细节（**页面不渲染**；留给「复制诊断信息」这类入口）。
        type: string
      error:
        description: Error 是终态结论句（页面直接显示）。
        type: string
      payload:
        description: Payload 是结果数据面（按 action 形态不同；前端按 action 解析）。
      sessionId:
        type: string
      status:
        description: Status ∈ pending | succeeded | failed | timeout。
        type: string
      streamTicket:
        description: |-
          StreamTicket 是一次性流票据（三期）：指令建立了流会话时，**每次**轮询响应
          都新签一张（TTL 30s、单次使用，绑定 userId+sessionId+deviceId）。前端接流
          时用**最新**的那张；票据不进日志、不上报，只在该响应里出现。
        type: string
    type: object
  response.DockerComposeInfoResp:
    properties:
      flavor:
        type: string
      version:
        type: string
    type: object
  response.DockerContainerItem:
    properties:
      composeProject:
        type: string
      composeService:
        type: string
      cpuPercent:
        type: number
      created:
        type: integer
      id:
        type: string
      image:
        type: string
      memLimitMb:
        type: number
      memUsageMb:
        type: number
      name:
        type: string
      netRxBytesSec:
        type: number
      netTxBytesSec:
        type: number
      ports:
        items:
          $ref: '#/definitions/response.DockerPortItem'
        type: array
      protected:
        type: boolean
      startedAt:
        type: integer
      state:
        type: string
      statusText:
        type: string
    type: object
  response.DockerFleetContainers:
    properties:
      protected:
        description: Protected 是受保护容器的数量（不论运行态；结论由 agent 按保护清单算好）。
        type: integer
      running:
        description: Running 是 state=running 的容器数。
        type: integer
      stopped:
        description: |-
          Stopped = Total - Running：泛指一切非 running（exited/created/paused/dead…），
          与异常清单的收录口径同一句话（两边各写一套就又出现一次口径分裂）。
        type: integer
      total:
        type: integer
    type: object
  response.DockerFleetDisk:
    properties:
      buildCacheMb:
        type: number
      hosts:
        description: |-
          Hosts 是**有 df 数据**的主机数（快照 disk_usage 非 nil 的主机数）。与
          fleet.hosts.total 并排读就是「4 台里 3 台报了磁盘账」—— 没报的那台不是
          0 占用，是不知道；计数如实标注而不是把缺报主机折算成零。
        type: integer
      imagesDanglingMb:
        description: |-
          ImagesDanglingMB 是**执行 image:prune（默认口径，只清悬空）后真会释放的字节**
          —— 逐镜像只算独占层（共享给他人的层删了也不会释放）。

          为什么不是 Σ 悬空镜像的 Size：那是「从没存在过的空间」（实测承诺 3.04GB、
          prune 只回收 2052 字节）。卷的可回收数不在此列 —— volume:prune 只回收匿名
          未用卷，合计口径在协议上拿不到（df 不区分匿名），入口在卷页的清理流，
          面板只给未用卷的**计数**、不给体积承诺。
        type: number
      imagesTotalMb:
        description: |-
          ImagesTotalMB / VolumesTotalMB / BuildCacheMB 是三类占用合计（MB）。

          ImagesTotalMB 是**层存储**的合计（共享层只算一次）= `docker system df` 的
          Images/SIZE 列 —— 面板与 CLI 必须对得上；Σ 镜像条目 SizeMB 会把共享层按
          引用它的镜像个数重复计入（实测比 df 高出两成，六期对账修掉了这个口径）。
        type: number
      volumesTotalMb:
        type: number
    type: object
  response.DockerFleetHosts:
    properties:
      dockerOk:
        description: DockerOK 是 dockerOk=true 的主机数（agent 自报的能力信号）。
        type: integer
      total:
        description: Total 是本响应 hosts 列表的行数（读失败的主机也算一台 —— 行还在，err 如实）。
        type: integer
    type: object
  response.DockerFleetImages:
    properties:
      total:
        type: integer
      unused:
        type: integer
    type: object
  response.DockerFleetNetworks:
    properties:
      total:
        type: integer
    type: object
  response.DockerFleetProjects:
    properties:
      running:
        description: |-
          Running 是 state=running 的项目数（项目态 ∈ running|partial|stopped，
          由 agent 按成员容器归纳 —— 非 running 项目不上异常清单，那是容器粒度的清单）。
        type: integer
      total:
        type: integer
    type: object
  response.DockerFleetVolumes:
    properties:
      total:
        type: integer
      unused:
        type: integer
    type: object
  response.DockerHostDiskItem:
    properties:
      buildCacheMb:
        type: number
      danglingImages:
        description: |-
          DanglingImages 是悬空镜像计数（与镜像页「可回收」计数同一判据：agent 的
          Dangling 结论，前端不重算）。
        type: integer
      imagesDanglingMb:
        description: |-
          ImagesDanglingMB 是执行 image:prune（默认只清悬空）后**真会释放**的字节：
          悬空镜像的独占层之和（共享层删了也不会释放，故不计）。
        type: number
      imagesMb:
        description: |-
          ImagesMB / VolumesMB / BuildCacheMB 是三类占用（MB；system df 的同帧口径）。
          ImagesMB 是**层存储**的合计（共享层只算一次）—— 与 `docker system df` 的
          Images/SIZE 逐字对得上，不是 Σ 镜像条目的 SizeMB（那会把共享层重复计入）。
        type: number
      unusedVolumes:
        description: |-
          UnusedVolumes 是未被任何容器挂载的卷计数。注意它**不是** volume:prune 的
          回收数：prune 只收匿名未用卷，命名卷走卷页的独立删除流 —— 面板只给计数
          与入口，清理动作在列表页的确认档流里发生。
        type: integer
      volumesMb:
        type: number
    type: object
  response.DockerHostItem:
    properties:
      composeFlavor:
        type: string
      composeVersion:
        type: string
      containers:
        type: integer
      disk:
        allOf:
        - $ref: '#/definitions/response.DockerHostDiskItem'
        description: |-
          Disk 是该主机的磁盘占用账目（system df 汇总 + 可回收计数）。**nil = 无 df 数据**
          （那帧 df 失败、或旧版 agent 不发 disk_usage）—— 页面显示「数据不可用」而不是 0
          （与卷条目 SizeMB=nil 同一纪律：不知道 ≠ 零）。只在总览响应填充（磁盘面板的
          专供数据面）；主机清单页不消费它，omitempty 让字段在那边缺席。
      dockerOk:
        description: DockerOK 是 agent 自报的能力信号；false 时前端不渲染任何操作按钮。
        type: boolean
      error:
        description: Error 是 dockerOK=false 的结论句。
        type: string
      hostname:
        type: string
      id:
        example: "0"
        type: string
      images:
        type: integer
      lastSync:
        description: LastSync 是 core 收到快照的时刻（unix 秒）；0 = 从未上报。
        type: integer
      online:
        description: Online 由 last_seen_at 与 sys.agent.offlineThreshold 折算（与设备列表同口径）。
        type: boolean
      primaryIp:
        type: string
      stale:
        description: Stale 是服务端算好的结论（>max(3×周期, 90s) 未更新）。
        type: boolean
    type: object
  response.DockerHostListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/response.DockerHostItem'
        type: array
      snapshotInterval:
        description: |-
          SnapshotInterval 是当前快照周期（秒）：前端据此算「同步于 N 秒前」的文案，
          与后端 stale 判定同源（各自硬编码会让两边对「多久算陈旧」给出不同答案）。
        type: integer
    type: object
  response.DockerImageHostDiskItem:
    properties:
      danglingCount:
        description: |-
          DanglingCount 是这台主机上悬空（无标签）镜像的计数：agent 的 Dangling 结论，
          与总览 DanglingImages、镜像表「使用」列的「可回收（无标签）」同一判据，前端
          不重算。计数本身来自清单事实（不依赖 df），但它只随账目一起给出 ——「N 个」
          与「X MB」必须同主机口径（一个数字覆盖另一批主机会让两个数互相打架）。
        type: integer
      danglingMb:
        description: |-
          DanglingMB 是执行 image:prune（默认只清悬空）后**真会释放**的字节（MB）：
          悬空镜像的独占层之和（共享层删了也不会释放，故不计）—— agent 的 df 对账后
          口径，与总览 disk.imagesDanglingMb 同一句话。不是 Σ 悬空条目的 SizeMB
          （实测那是「从没存在过的空间」：承诺 3.04GB、prune 只回收 2052 字节）。
        type: number
      hostId:
        description: HostID 是主机设备 ID（与清单条目的归属列同源）。
        example: "0"
        type: string
    type: object
  response.DockerImageItem:
    properties:
      created:
        type: integer
      dangling:
        type: boolean
      id:
        type: string
      inUse:
        type: boolean
      inUseBy:
        items:
          type: string
        type: array
      repoTags:
        items:
          type: string
        type: array
      sizeMb:
        type: number
    type: object
  response.DockerImageListItem:
    properties:
      created:
        type: integer
      dangling:
        type: boolean
      hostId:
        example: "0"
        type: string
      hostname:
        type: string
      id:
        type: string
      inUse:
        type: boolean
      inUseBy:
        items:
          type: string
        type: array
      repoTags:
        items:
          type: string
        type: array
      sizeMb:
        type: number
    type: object
  response.DockerImageListResp:
    properties:
      disk:
        description: |-
          Disk 是**主机范围**内的可回收镜像账目（镜像页底栏「N 个可回收 · X」的数据面）：
          每台主机一行，前端按行求和。与 Items 的分工是这一页两种口径的分工：

            - Items 是**筛选后的行**（keyword/dangling/unused + 500 条截断都作用其上），
              底栏「合计」跟着它走；
            - Disk 是**主机范围的账**：keyword/dangling/unused 过筛**不影响**它 ——
              prune 回收的就是这台主机当下的可回收批，与「此刻在看哪些行」无关；
              hostId 过滤影响它（账目必须跟着主机范围收窄）。500 条截断同样影响不到它
              （账目在截断之前按主机整机收）—— 旧前端口径 Σ 可见悬空行 SizeMB 会因
              截断少算、也会把 prune 释放不了的共享层算进去，这里是唯一的修正口径。

          口径与总览的磁盘账同一句话：可回收 = 执行 image:prune（默认只清悬空）真会
          释放的字节（悬空镜像的独占层之和，agent 的 df 对账口径）。

          **只收录账目完整的主机**（快照可读且该帧有 df 数据）：读失败 / 从未上报 /
          无 df 数据（旧版 agent）的主机一律缺席 ——「缺席 = 不知道」，不是零；前端对
          数组为空（没有任何主机报账）如实说「不可用」而不是折算成 0（与总览磁盘
          KPI「—/数据不可用」、主机行 disk=nil 同一条纪律）。空数组而非 null（与其它
          清单同一约定，前端少一层判空）。
        items:
          $ref: '#/definitions/response.DockerImageHostDiskItem'
        type: array
      items:
        items:
          $ref: '#/definitions/response.DockerImageListItem'
        type: array
      total:
        description: |-
          Total 是**截断前**的过滤后全量数；Items 至多 500 条（两者不等即
          「截断了」的显式信号，口径与统一工作负载表同一句）。
        type: integer
    type: object
