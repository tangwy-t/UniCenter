      consumes:
      - application/octet-stream
      description: 直传 gzip 压缩的 tar 构建上下文（octet-stream/chunked）；core 流式中转至 agent 的
        transferDir 并逐字节累计 sha256，agent 终验后落名 build-ctx-<会话号>.tar.gz；返回文件名（image:build
        的 context 值）
      parameters:
      - description: 设备ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 上传完成（filename 即 context 值）
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DockerBuildContextUploadResp'
              type: object
        "400":
          description: 参数错误 / 超过 512MB 上限 / 内容不是 gzip tar / 上传为空
          schema:
            allOf:
            - $ref: '#/definitions/app.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DockerBuildContextUploadResp'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: 无权限(docker:manage)
          schema:
            $ref: '#/definitions/app.Response'
        "503":
          description: 设备离线 / 通道中断（上传未完成，请重试）
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: 上传构建上下文
      tags:
      - Docker 管理
  /docker/hosts/{id}/cmds:
    post:
