# web 生产镜像的 nginx 配置
# 职责：托管 dist 静态资源 + 将 /api 反向代理到后端 uni_core 服务
# 说明：前端源码里 VITE_API_URL=/api/v1，请求以 /api 开头，
#       由 nginx 统一转发到 Go 后端（compose 服务名 uni_core:8088），
#       从而规避跨域，且无需在前端构建时写死后端地址。

# WebSocket 升级所需（map 是 http 上下文指令，须置于 server 块之外）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 文件上传:nginx 默认 client_max_body_size 仅 1m,大文件请求体
    # 会在反代层被直接 413 拒绝,业务层(Go)根本收不到。
    # 这里放宽到 512m 作为传输层上限;应用层真实上限仍由
    # 参数配置 sys.file.upload.maxSize 控制(后端校验并返回业务错误)。
    client_max_body_size 512m;

    # gzip 静态资源压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # agent 通道**只走 TLS**：明文入口在这里被拒。
    # 为什么必须拒：agent 与 core 之间是「无签名的信封」，二期起 core→agent 的指令
    # 能换来宿主机 root 执行；明文入口等于把这条通道暴露给内网 MITM。
    location = /api/v1/agent/ws {
        return 403;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://uni_core:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（/api/v1/ws）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # ── 长活端点群：>60s 属正常形态的请求必须脱离上面 /api/ 的 60s 空闲读超时 ──
    #
    # 为什么必须单列：proxy_read_timeout 的语义是「上游静默多久算死」——普通请求
    # 60s 足够，长活端点却会把「没有新数据」误判成死连接：用户盯着一个安静的 shell、
    # 等一个卡在 RUN 的构建、镜像层慢慢拉 —— 60s 一到 nginx 就掐断上游连接；叠加
    # 本波「断流 = best-effort cancel」语义，掐断还会升级成取消操作本身（杀拉取）。
    # 空闲回收归 core/agent 各自机制（dockerstream 的 10min idle sweep 等），这里
    # 只负责不提前超时。
    # 清单的事实源是 Go 侧（uni_core/internal/router/router.go 的 longLived 挂载点）；
    # 本文件与之的跨层对齐由 router 包 TestNginxLongLivedLocationsMatchRouterMounts
    # 守卫 —— 增删长活端点而不同步这里，Go 侧测试会红。

    # ① 流类（NDJSON 进度/日志/事件 + 终端 WebSocket 升级）。
    # proxy_buffering off 保证 NDJSON 逐行即到（core 也发了 X-Accel-Buffering: no，
    # 双保险）；WebSocket 升级共用同组升级头。
    location ~ ^/api/v1/docker/(events|hosts/[^/]+/(cmds/[^/]+/(stream|stats|pull|build|push)|stream/exec))$ {
        proxy_pass http://uni_core:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # ② 大文件流式下载 + 慢采集（GET）：files 的 download/preview 走 ServeContent
    # 流式吐几十~几百 MB（视频/安装包）；agent 发布物下载是几十 MB 二进制走内网/
    # 弱网；pprof 的 profile/trace 要采 N 秒（?seconds=N，N≥30）才回写响应。
    # 三者传输/采集时长都天然超过 60s。
    location ~ ^/api/v1/(files/[^/]+/(download|preview)|agent/releases/[^/]+/download|monitor/debug/pprof/.*)$ {
        proxy_pass http://uni_core:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # ③ 长活请求体（POST 上传）：构建上下文 ≤512MB、文件 ≤512MB、agent 程序包
    # ≤200MB —— 弱网下传超过 60s 是常态，且默认 client_body_timeout 也是 60s，
    # 会先于 Go 侧把长传掐掉。三段链路都要放行：客户端→nginx 的请求体读
    #（client_body_timeout）、nginx→core 的请求体写（proxy_send_timeout，
    # 默认 60s）、core 收完后处理与回响应（proxy_read_timeout）。
    # 同路径的 GET 兄弟（列表查询）只是上界放宽：整条响应的绝对截止仍在 Go 侧
    #（非长活路由的 WriteTimeout），不存在连接挂而不死的风险。
    location ~ ^/api/v1/(files|devices/releases|docker/hosts/[^/]+/build-context)$ {
        proxy_pass http://uni_core:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA 前端路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html：SPA 壳必须每次重新校验（不缓存），
    # 否则浏览器沿用旧的 index.html 引用旧版本 JS，导致线上构建更新/图标修复不生效。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 静态资源带 hash，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── agent 专用 TLS 终端（控制台自身仍是 80/HTTP，用户侧不受影响）────────────
#
# 为什么单独开一个端口而不是把控制台整体切到 TLS：控制台是用户侧入口，
# 证书/域名/合规节奏不受本项目控制；而 agent 通道的威胁模型不同 ——
# 它承载的指令二期起能换来宿主机 root 执行，必须加密且验身份。
server {
    listen 20443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/uni-center.crt;
    ssl_certificate_key /etc/nginx/certs/uni-center.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:agenttls:2m;

    # WebSocket 升级（agent 长连接）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # **不**透传 X-Forwarded-For：agent 的 IP 由 core 直接观测对端地址
    #（core 侧 trustedProxies 为空，伪造成本最低的信任链最安全）。
    proxy_read_timeout 300s;

    location /api/ {
        proxy_pass http://uni_core:8088;
    }

    # agent 发布物下载（升级链路）：几十 MB 二进制走内网/弱网，服务器级的 300s
    # 读超时覆盖 WS 心跳绰绰有余，对「长停顿的慢下载」却会导致下到一半被反代
    # 掐断（与 Go 侧 P0 同型的另一层）。与 web 侧同口径拉长读超时，且不落盘
    # 缓冲直接透传（proxy_buffering off）——两个 location 都未覆写
    # proxy_set_header，升级头按服务器级继承，与既有 /api/ 行为一致。
    location ~ ^/api/v1/agent/releases/[^/]+/download$ {
        proxy_pass http://uni_core:8088;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}