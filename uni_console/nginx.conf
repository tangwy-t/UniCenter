# web 生产镜像的 nginx 配置
# 职责：托管 dist 静态资源 + 将 /api 反向代理到后端 uni_core 服务
# 说明：前端源码里 VITE_API_URL=/api/v1，请求以 /api 开头，
#       由 nginx 统一转发到 Go 后端（compose 服务名 uni_core:8088），
#       从而规避跨域，且无需在前端构建时写死后端地址。

# WebSocket 升级所需（map 是 http 上下文指令，须置于 server 块之外）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 文件上传:nginx 默认 client_max_body_size 仅 1m,大文件请求体
    # 会在反代层被直接 413 拒绝,业务层(Go)根本收不到。
    # 这里放宽到 512m 作为传输层上限;应用层真实上限仍由
    # 参数配置 sys.file.upload.maxSize 控制(后端校验并返回业务错误)。
    client_max_body_size 512m;

    # gzip 静态资源压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://uni_core:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（/api/v1/ws）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # SPA 前端路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html：SPA 壳必须每次重新校验（不缓存），
    # 否则浏览器沿用旧的 index.html 引用旧版本 JS，导致线上构建更新/图标修复不生效。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 静态资源带 hash，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}