name: CI

# 门禁清单 —— 全部为仓库既有的 Makefile / package.json 脚本,无新增工具。
#
# 背景:仓库此前无任何 CI。代价已经显现 —— 前端累积 118 个 ESLint 错误
# (其中 117 个是 prettier 格式问题,可 --fix 自动消除),而
# `check:api-types`(Go DTO → 前端 wire 类型的漂移守卫)只能依赖人工记得执行。
#
# 本工作流只做一件事:在 PR / push 时把已有脚本跑一遍。它们是廉价的 ——
# 前端 207 个用例约 2 秒,typecheck 约 30 秒。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uni_console:
    name: Frontend (typecheck / lint / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uni_console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: pnpm
          cache-dependency-path: uni_console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 顺序有意从快到慢:类型错误比测试失败更廉价地暴露契约问题。
      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  uni_core:
    name: Backend (vet / lint / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uni_core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: uni_core/go.sum

      - run: go mod download

      - name: go vet
        run: go vet ./...

      - name: gofmt (check only)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests
        run: go test ./... -race

  contract:
    name: Wire contract drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: uni_core/go.sum

      # apigen 从 Go 响应 DTO 的 json tag 生成前端类型,并从
      # internal/pkg/permission 生成前端权限码常量。
      # 若生成结果与已提交文件不一致,说明有人改了 DTO / 权限码却忘了重新生成 ——
      # 前端会继续按旧契约编译通过,直到运行时才炸。权限码漂移守卫再兜底扫描
      # 前端残留的 system:xxx 字面量是否都仍合法。
      - name: Regenerate and diff
        run: |
          cd uni_core && go run ./tools/apigen -out ../uni_console/src/types/api/api.generated.d.ts -permout ../uni_console/src/enums/permission.ts
          cd .. && git diff --exit-code -- uni_console/src/types/api/api.generated.d.ts uni_console/src/enums/permission.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Permission drift guard (frontend)
        run: node scripts/check-permissions.mjs
        working-directory: uni_console
