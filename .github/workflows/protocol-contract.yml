name: protocol-contract

on:
  push:
    paths:
      - 'uni_protocol/**'
      - 'go.work'
      - '.github/workflows/protocol-contract.yml'
  pull_request:
    paths:
      - 'uni_protocol/**'
      - 'go.work'
      - '.github/workflows/protocol-contract.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 格式检查（gofmt）
        working-directory: uni_protocol
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查（go vet）
        working-directory: uni_protocol
        run: go vet ./...

      - name: 单元测试（含 -race）
        working-directory: uni_protocol
        run: go test ./... -race

      - name: 契约形状守护（单源守卫 / 未知字段容忍 / 漂移 additive-only / golden）
        working-directory: uni_protocol
        run: |
          go test ./... -v -run 'TestJSONTagConventions|TestUnknownFieldsAreTolerated|TestShapeDriftAdditiveOnly|TestGoldenFilesRoundTrip|TestRegistryIsCompleteAndConsistent|TestVersionsAreConsistent|TestCloseCodesAreExhaustivelyMapped|TestSnapshotDTORegistryCoversAllPayloads'

      - name: 模糊测试短跑（Decode + Encode 两个目标）
        working-directory: uni_protocol
        run: |
          go test ./... -run FuzzDecodeEnvelope -fuzz FuzzDecodeEnvelope -fuzztime 10s
          go test ./... -run FuzzEncode -fuzz FuzzEncode -fuzztime 10s

      - name: 零依赖校验
        working-directory: uni_protocol
        run: |
          deps=$(go list -m all | tail -n +2 | wc -l)
          if [ "$deps" -ne 0 ]; then
            echo "uni_protocol 必须零第三方依赖，实际 $deps 个："
            go list -m all
            exit 1
          fi
